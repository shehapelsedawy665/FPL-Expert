kind = "web"
previewPath = "/"
title = "FPL Expert"
description = "A simple Fantasy Premier League analysis homepage built as the starting point for a future FPL insights app."
version = "1.0.0"
id = "artifacts/fpl-expert"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22331

[services.development]
run = "pnpm --filter @workspace/fpl-expert run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fpl-expert", "run", "build" ]
serve = "static"
publicDir = "artifacts/fpl-expert/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22331"
BASE_PATH = "/"
